name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传 Linux 安装包到指定 Release tag（如 v0.5.0）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Composer validate (if composer.json exists)
        shell: pwsh
        run: |
          if (Test-Path composer.json) {
            composer validate --strict
          } else {
            Write-Output "composer.json 尚未创建，跳过"
          }

      - name: PHP lint (src, agent, control-panel)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src, agent, control-panel -Recurse -Filter *.php -ErrorAction SilentlyContinue
          if ($files) {
            $files | ForEach-Object { php -l $_.FullName }
          } else {
            Write-Output "尚无 PHP 文件，跳过"
          }

      - name: Site render check (bilingual toggle)
        shell: bash
        run: |
          node tests/site-render-check.mjs

  installer:
    name: Installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Run installer smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/run-tests.ps1

  linux-package:
    name: Linux package (build + smoke)
    runs-on: ubuntu-latest
    # 大体积下载/编译任务仅在 main 推送或手动触发时执行，PR 只跑轻量校验
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Run installer smoke tests (linux)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/run-tests.ps1

      - name: Cache Linux build artifacts (dist/binaries + dist/tools)
        uses: actions/cache@v4
        with:
          path: |
            dist/binaries
            dist/tools
          key: linux-build-${{ hashFiles('installer/config/versions-linux-x86_64.json') }}
          restore-keys: |
            linux-build-

      - name: Install Linux build dependencies (Redis / UPX / MySQL runtime)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make gcc \
            xz-utils unzip upx-ucl \
            curl ca-certificates
          # MySQL 8.0 服务端需要 libaio；Ubuntu 24.04+ 包名为 libaio1t64（t64 迁移）
          sudo apt-get install -y --no-install-recommends libaio1t64 || \
            sudo apt-get install -y --no-install-recommends libaio1
          # Ubuntu 24.04+ 的 libaio1t64 只提供 libaio.so.1t64，为 MySQL 8.0 创建兼容符号链接
          sudo ln -sf libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1 || true

      - name: Build Linux package (versions-linux-x86_64.json)
        shell: pwsh
        env:
          # static-php-cli 需要 GitHub API；匿名访问在并行构建时容易触发 403 限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File installer/scripts/build-linux-package.ps1 -Env linux-x86_64

      - name: Smoke test (extract + install + HTTP / MySQL / Redis)
        shell: bash
        run: bash installer/scripts/linux/smoke-test.sh linux-x86_64 2.17 "$GITHUB_WORKSPACE"
      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: frampp-linux-x86_64
          path: dist/installer/frampp-*-linux-x86_64.run
          retention-days: 14

      - name: Upload to GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/installer
          PKG="$(ls frampp-*-linux-x86_64.run | head -n1)"
          echo "Uploading $PKG to ${{ github.event.inputs.release_tag }}"
          gh release upload "${{ github.event.inputs.release_tag }}" "$PKG" --clobber

      - name: Upload to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/installer
          PKG="$(ls frampp-*-linux-x86_64.run | head -n1)"
          echo "Uploading $PKG to ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" "$PKG" --clobber

  linux-package-aarch64:
    name: Linux package aarch64 (build + smoke)
    # GitHub 托管的原生 arm64 runner（公共仓库可用）；编译与 strip 均需目标架构工具链
    runs-on: ubuntu-24.04-arm
    # 大体积下载/编译任务仅在 main 推送、tag 或手动触发时执行，PR 只跑轻量校验
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies + PHP (arm64)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            php-cli php-mbstring php-curl php-xml php-sqlite3 \
            build-essential make gcc xz-utils unzip curl ca-certificates file binutils
          # MySQL 8.0 服务端需要 libaio（arm64 路径与 x86_64 不同）
          sudo apt-get install -y --no-install-recommends libaio1t64 || \
            sudo apt-get install -y --no-install-recommends libaio1
          sudo ln -sf libaio.so.1t64 /usr/lib/aarch64-linux-gnu/libaio.so.1 || true

      - name: Run installer smoke tests (aarch64)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/run-tests.ps1

      - name: Cache Linux aarch64 build artifacts (dist/binaries + dist/tools)
        uses: actions/cache@v4
        with:
          path: |
            dist/binaries
            dist/tools
          key: linux-aarch64-build-${{ hashFiles('installer/config/versions-linux-aarch64.json') }}
          restore-keys: |
            linux-aarch64-build-

      - name: Build Linux package (versions-linux-aarch64.json)
        shell: pwsh
        env:
          # static-php-cli 需要 GitHub API；匿名访问在并行构建时容易触发 403 限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File installer/scripts/build-linux-package.ps1 -Env linux-aarch64

      - name: Smoke test (extract + install + HTTP / MySQL / Redis)
        shell: bash
        run: bash installer/scripts/linux/smoke-test.sh linux-aarch64 2.28 "$GITHUB_WORKSPACE"

      - name: Upload Linux aarch64 package artifact
        uses: actions/upload-artifact@v4
        with:
          name: frampp-linux-aarch64
          path: dist/installer/frampp-*-linux-aarch64.run
          retention-days: 14

      - name: Upload to GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/installer
          PKG="$(ls frampp-*-linux-aarch64.run | head -n1)"
          echo "Uploading $PKG to ${{ github.event.inputs.release_tag }}"
          gh release upload "${{ github.event.inputs.release_tag }}" "$PKG" --clobber

      - name: Upload to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/installer
          PKG="$(ls frampp-*-linux-aarch64.run | head -n1)"
          echo "Uploading $PKG to ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" "$PKG" --clobber

  docker:
    name: Docker image amd64 (build + smoke + push)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: linux-package
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: frampp-linux-x86_64
          path: dist/installer

      - name: Read FRAMPP version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Locate Linux package
        id: pkg
        shell: bash
        run: |
          PKG="$(find dist/installer -maxdepth 1 -name 'frampp-*-linux-x86_64.run' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "Linux .run package not found" >&2
            exit 1
          fi
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"
          echo "Using package: $PKG"

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wangbo5825/frampp
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-amd64

      - name: Build image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            FRAMPP_PACKAGE=${{ steps.pkg.outputs.pkg }}
          tags: frampp:ci

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euxo pipefail
          CID="frampp-ci-$$"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$CID" -p 18080:8080 -p 18081:8081 frampp:ci

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null 2>&1; then
              echo "panel ready after ${i}s"
              break
            fi
            sleep 1
          done

          SITE_BODY="$(curl -fsS --max-time 20 http://127.0.0.1:18080/ || true)"
          printf '%s' "$SITE_BODY" | grep -q 'FRAMPP' || { echo "SITE_NOT_OK"; exit 1; }
          PANEL_BODY="$(curl -fsS --max-time 20 http://127.0.0.1:18081/ || true)"
          printf '%s' "$PANEL_BODY" | grep -q 'FRAMPP 控制面板' || { echo "PANEL_NOT_OK"; exit 1; }
          docker exec "$CID" /opt/frampp/bin/frampp status --json
          docker exec "$CID" /opt/frampp/bin/frampp version
          docker logs "$CID" | tail -n 40

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            FRAMPP_PACKAGE=${{ steps.pkg.outputs.pkg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-arm64:
    name: Docker image arm64 (build + smoke + push)
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    needs: linux-package-aarch64
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: frampp-linux-aarch64
          path: dist/installer

      - name: Read FRAMPP version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Locate Linux aarch64 package
        id: pkg
        shell: bash
        run: |
          PKG="$(find dist/installer -maxdepth 1 -name 'frampp-*-linux-aarch64.run' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "Linux aarch64 .run package not found" >&2
            exit 1
          fi
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"
          echo "Using package: $PKG"

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wangbo5825/frampp
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-arm64

      - name: Build image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            FRAMPP_PACKAGE=${{ steps.pkg.outputs.pkg }}
          tags: frampp:ci-arm64

      - name: Smoke test Docker image (arm64)
        shell: bash
        run: |
          set -euxo pipefail
          CID="frampp-ci-arm64-$$"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$CID" -p 18080:8080 -p 18081:8081 frampp:ci-arm64

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null 2>&1; then
              echo "panel ready after ${i}s"
              break
            fi
            sleep 1
          done

          SITE_BODY="$(curl -fsS --max-time 20 http://127.0.0.1:18080/ || true)"
          printf '%s' "$SITE_BODY" | grep -q 'FRAMPP' || { echo "SITE_NOT_OK"; exit 1; }
          PANEL_BODY="$(curl -fsS --max-time 20 http://127.0.0.1:18081/ || true)"
          printf '%s' "$PANEL_BODY" | grep -q 'FRAMPP 控制面板' || { echo "PANEL_NOT_OK"; exit 1; }
          docker exec "$CID" /opt/frampp/bin/frampp status --json
          docker exec "$CID" /opt/frampp/bin/frampp version
          docker logs "$CID" | tail -n 40

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            FRAMPP_PACKAGE=${{ steps.pkg.outputs.pkg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-manifest:
    name: Docker manifest (multi-arch)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        shell: bash
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=ghcr.io/wangbo5825/frampp
          docker manifest create "$IMAGE:$VERSION" \
            --amend "$IMAGE:$VERSION-amd64" \
            --amend "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:$VERSION"
          docker manifest create "$IMAGE:latest" \
            --amend "$IMAGE:$VERSION-amd64" \
            --amend "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:latest"
