name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传 Linux 安装包到指定 Release tag（如 v0.5.0）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Composer validate (if composer.json exists)
        shell: pwsh
        run: |
          if (Test-Path composer.json) {
            composer validate --strict
          } else {
            Write-Output "composer.json 尚未创建，跳过"
          }

      - name: PHP lint (src, agent, control-panel)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src, agent, control-panel -Recurse -Filter *.php -ErrorAction SilentlyContinue
          if ($files) {
            $files | ForEach-Object { php -l $_.FullName }
          } else {
            Write-Output "尚无 PHP 文件，跳过"
          }

      - name: Site render check (bilingual toggle)
        shell: bash
        run: |
          node tests/site-render-check.mjs

  installer:
    name: Installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Run installer smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/run-tests.ps1

  linux-package:
    name: Linux package (build + smoke)
    runs-on: ubuntu-latest
    # 大体积下载/编译任务仅在 main 推送或手动触发时执行，PR 只跑轻量校验
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Run installer smoke tests (linux)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/run-tests.ps1

      - name: Cache Linux build artifacts (dist/binaries + dist/tools)
        uses: actions/cache@v4
        with:
          path: |
            dist/binaries
            dist/tools
          key: linux-build-${{ hashFiles('installer/config/versions-linux-x86_64.json') }}
          restore-keys: |
            linux-build-

      - name: Install Linux build dependencies (MariaDB / spc / UPX)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake bison pkg-config \
            libssl-dev libpcre2-dev zlib1g-dev libncurses-dev libcurl4-openssl-dev \
            libxml2-dev libonig-dev libreadline-dev libargon2-dev libsodium-dev \
            libsqlite3-dev libbz2-dev libzip-dev libyaml-dev libffi-dev \
            xz-utils unzip upx-ucl autoconf libaio-dev liburing-dev \
            libgnutls28-dev liblz4-dev libedit-dev libsnappy-dev \
            libpam0g-dev libkrb5-dev libsystemd-dev libcrack2-dev libcap-dev

      - name: Build Linux package (versions-linux-x86_64.json)
        shell: pwsh
        run: |
          pwsh -NoProfile -File installer/scripts/build-linux-package.ps1 -Env linux-x86_64

      - name: Smoke test (extract + install + HTTP / MySQL / Redis)
        shell: bash
        run: |
          set -euxo pipefail
          cd dist/installer
          PKG="$(ls frampp-setup-*-linux-x86_64.run | head -n1)"
          chmod +x "$PKG"
          ./"$PKG" --prefix "$PWD/frampp"
          cd frampp
          echo "=== init already ran inside .run; verify idempotent init ==="
          ./bin/frampp init
          echo "=== Caddyfile ==="
          cat etc/Caddyfile
          echo "=== status ==="
          ./bin/frampp status --json || true
          echo "=== version ==="
          ./bin/frampp version || true
          echo "=== extensions ==="
          ./modules/frankenphp/frankenphp php-cli -r "printf('apcu=%s redis=%s mysqli=%s pdo_sqlite=%s simplexml=%s openssl=%s%s', extension_loaded('apcu')?'yes':'NO', extension_loaded('redis')?'yes':'NO', extension_loaded('mysqli')?'yes':'NO', extension_loaded('pdo_sqlite')?'yes':'NO', extension_loaded('simplexml')?'yes':'NO', extension_loaded('openssl')?'yes':'NO', PHP_EOL);" || true
          echo "=== caddy version (require >= 2.11.4) ==="
          ./modules/frankenphp/frankenphp version | grep -E "Caddy v2\.11\.4|v2\.11\.4" || { echo "CADDY_VERSION_TOO_OLD"; exit 1; }
          echo "=== http 8080 (headers+body head) ==="
          curl -sS -i --max-time 15 http://127.0.0.1:8080/ | head -n 30 || true
          echo "=== http 8081 (headers+body head) ==="
          curl -sS -i --max-time 15 http://127.0.0.1:8081/ | head -n 30 || true
          echo "=== http 8081 direct /index.php (diagnostic) ==="
          curl -sS -i --max-time 15 http://127.0.0.1:8081/index.php | head -n 20 || true
          echo "=== http 8081 direct /action.php (diagnostic) ==="
          curl -sS -i --max-time 15 http://127.0.0.1:8081/action.php | head -n 20 || true
          echo "=== panel must render (assert) ==="
          PANEL_BODY="$(curl -sS --max-time 15 http://127.0.0.1:8081/ || true)"
          if printf '%s' "$PANEL_BODY" | grep -q '<?php'; then
            echo "PANEL_SERVED_RAW_PHP"; exit 1
          fi
          if ! printf '%s' "$PANEL_BODY" | grep -q 'FRAMPP 控制面板'; then
            echo "PANEL_NOT_RENDERED"; exit 1
          fi
          echo "PANEL_OK"
          echo "=== adapted config (routes per server) ==="
          ./modules/frankenphp/frankenphp adapt --config etc/Caddyfile --adapter caddyfile 2>/dev/null \
            | grep -o '"handler":"[a-z_]*"' | sort | uniq -c || true
          echo "=== control-panel/web listing ==="
          ls -la modules/control-panel/web || true
          echo "=== slim checks (mariadb-test must be gone) ==="
          du -sh modules/mariadb modules/python modules/frankenphp modules/redis || true
          if [ -d modules/mariadb/mariadb-test ]; then
            echo "MARIADB_TEST_STILL_PRESENT"; exit 1
          fi
          echo "SLIM_OK"
          echo "=== portability checks ==="
          echo "--- FrankenPHP must be static (musl, no glibc dep) ---"
          if file modules/frankenphp/frankenphp | grep -qi "statically linked"; then
            echo "FRANKENPHP_STATIC_OK"
          else
            echo "FRANKENPHP_NOT_STATIC"; exit 1
          fi
          echo "--- MariaDB glibc baseline must be <= 2.31 ---"
          bash "$GITHUB_WORKSPACE/installer/scripts/linux/assert-glibc-max.sh" modules/mariadb 2.31 mariadb
          echo "PORTABLE_OK"
          echo "=== service logs ==="
          tail -n 60 logs/frankenphp.err.log 2>/dev/null || true
          tail -n 40 logs/frankenphp.log 2>/dev/null || true
          tail -n 60 logs/mariadb.err.log 2>/dev/null || true
          tail -n 40 logs/mariadb.log 2>/dev/null || true
          tail -n 40 logs/mariadb-install-db.log 2>/dev/null || true
          tail -n 20 logs/panel-access.log logs/frankenphp-access.log 2>/dev/null || true
          echo "=== wait mysql port ==="
          mysql_ready() { (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null; }
          for i in $(seq 1 30); do
            if mysql_ready; then echo "mysql port open after ${i}s"; break; fi
            sleep 1
          done
          mysql_ready || { echo "MYSQL_PORT_NOT_READY"; exit 1; }
          ROOT_PW="$(sed -n 's/.*"mariadb_root_password"[^"]*"\([^"]*\)".*/\1/p' var/secrets.json)"
          REDIS_PW="$(sed -n 's/.*"redis_password"[^"]*"\([^"]*\)".*/\1/p' var/secrets.json)"
          ./modules/mariadb/bin/mysql --no-defaults --connect-timeout=5 -h127.0.0.1 -P3306 -uroot -p"$ROOT_PW" -e "SELECT VERSION();"
          ./modules/redis/redis-cli -h 127.0.0.1 -p 6379 -a "$REDIS_PW" --no-auth-warning ping
          echo "=== stop ==="
          ./bin/frampp stop all || true
          ./bin/frampp status --json || true

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: frampp-linux-x86_64
          path: dist/installer/frampp-setup-*-linux-x86_64.run
          retention-days: 14

      - name: Upload to GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/installer
          PKG="$(ls frampp-setup-*-linux-x86_64.run | head -n1)"
          echo "Uploading $PKG to ${{ github.event.inputs.release_tag }}"
          gh release upload "${{ github.event.inputs.release_tag }}" "$PKG" --clobber

  docker:
    name: Docker image (build + smoke + push)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: linux-package
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frampp-linux-x86_64
          path: dist/installer

      - name: Read FRAMPP version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Locate Linux package
        id: pkg
        shell: bash
        run: |
          PKG="$(find dist/installer -maxdepth 1 -name 'frampp-setup-*-linux-x86_64.run' -print -quit)"
          if [ -z "$PKG" ]; then
            echo "Linux .run package not found" >&2
            exit 1
          fi
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"
          echo "Using package: $PKG"

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wangbo5825/frampp
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            FRAMPP_PACKAGE=${{ steps.pkg.outputs.pkg }}
          tags: frampp:ci

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euxo pipefail
          CID="frampp-ci-$$"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$CID" -p 18080:8080 -p 18081:8081 frampp:ci

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18081/ >/dev/null 2>&1; then
              echo "panel ready after ${i}s"
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/ | grep -q 'FRAMPP'
          curl -fsS http://127.0.0.1:18081/ | grep -q 'FRAMPP 控制面板'
          docker exec "$CID" /opt/frampp/bin/frampp status --json
          docker exec "$CID" /opt/frampp/bin/frampp version
          docker logs "$CID" | tail -n 40

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            FRAMPP_PACKAGE=${{ steps.pkg.outputs.pkg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
