        .topbar {

        .brand { font-weight: 800; font-size: 19px; letter-spacing: .5px; }

        .topnav a { color: #cbd5e1; }
        .topnav a:hover { color: var(--accent); }

        }
        .hero .badge {
            display: inline-block; font-size: 13px; color: #a5f3fc; background: rgba(34,211,238,.12);

        .hero .logo { font-size: 58px; font-weight: 800; letter-spacing: 1px; }

        .hero .subline { margin-top: 10px; max-width: 720px; margin-left: auto; margin-right: auto; font-size: 15px; color: #94a3b8; }

        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #0b1220; box-shadow: 0 8px 24px rgba(34,211,238,.25); }

        .btn .os { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
        .stats { display: flex; justify-content: center; gap: 34px; margin-top: 40px; flex-wrap: wrap; }
        .stat .n { font-size: 22px; font-weight: 800; color: var(--accent); }
        .stat .l { font-size: 13px; color: #94a3b8; }

        .container { max-width: 980px; margin: 0 auto; padding: 0 24px; }
        section { padding: 60px 0; }
        section.alt { background: #f8fafc; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        h2 { font-size: 27px; margin-bottom: 6px; }
        .sub { color: var(--muted); font-size: 14px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .card h3 { font-size: 17px; margin-bottom: 6px; }
        .card p { font-size: 14px; color: var(--muted); }
        .card code { background: #f1f5f9; padding: 1px 6px; border-radius: 5px; font-size: 13px; }

        td code { background: #f1f5f9; padding: 1px 6px; border-radius: 5px; font-size: 13px; }

        .step p { font-size: 13px; color: var(--muted); }

        details p { margin-top: 8px; font-size: 14px; color: var(--muted); }
        details code { background: #f1f5f9; padding: 1px 6px; border-radius: 5px; font-size: 13px; }

        .release .ver { font-size: 20px; font-weight: 800; min-width: 110px; }
        .release .meta { font-size: 13px; color: var(--muted); }
        .release .body { flex: 1; min-width: 260px; }
        .release ul { margin: 6px 0 0 18px; font-size: 14px; color: var(--muted); }
        .release a { color: var(--accent-2); font-weight: 600; }

        .doclinks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
        .doc { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
        .doc h3 { font-size: 15px; margin-bottom: 4px; }
        .doc p { font-size: 13px; color: var(--muted); }
        .doc a { color: var(--accent-2); font-weight: 600; font-size: 13px; }

</head>

var LANG_KEY = "frampp_lang";

function getLang() {
    var params = new URLSearchParams(window.location.search);
    var fromUrl = params.get("lang");
    if (fromUrl === "zh" || fromUrl === "en") { return fromUrl; }
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) { saved = null; }
    if (saved === "zh" || saved === "en") { return saved; }
    // Default to English; browser language is intentionally ignored.
    return "en";
}

function esc(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function codeBlock(lines) {
    return "<pre>" + lines.map(function (line) {
        return line[0] === "c" ? '<span class="c">' + esc(line[1]) + "</span>" : esc(line[1]);
    }).join("\n") + "</pre>";
}

    // topbar
    document.getElementById("topnav").innerHTML = t.nav.map(function (n) {

    document.getElementById("langToggle").textContent = lang === "zh" ? "EN" : "中文";

    }).join("");

    // footer
    var f = t.footer;

// tab switching (quick start)
function switchTab(pane) {
    document.getElementById("tabLinux").classList.toggle("active", pane === "linux");
    document.getElementById("tabWindows").classList.toggle("active", pane === "windows");
    document.getElementById("tabDocker").classList.toggle("active", pane === "docker");
    document.getElementById("paneLinux").classList.toggle("active", pane === "linux");
    document.getElementById("paneWindows").classList.toggle("active", pane === "windows");
    document.getElementById("paneDocker").classList.toggle("active", pane === "docker");
}
document.getElementById("tabLinux").addEventListener("click", function () { switchTab("linux"); });
document.getElementById("tabWindows").addEventListener("click", function () { switchTab("windows"); });
document.getElementById("tabDocker").addEventListener("click", function () { switchTab("docker"); });

// language toggle
var currentLang = getLang();
document.getElementById("langToggle").addEventListener("click", function () {
    currentLang = currentLang === "zh" ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) { /* ignore */ }
    render(currentLang);
});

render(currentLang);
